<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Свобода — анкета путешественника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--o:#F17425;--t:#0BB5AF;--d:#076F71;--n:#14202B;--m:#EEF8F7;--line:#d3e2e1;--mut:#5b6f75;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Manrope,'Segoe UI',Arial,sans-serif;color:var(--n);background:var(--m);font-size:16px;line-height:1.5;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.34;animation:float 18s ease-in-out infinite}
.bg i:nth-child(1){background:var(--t);left:-20vmax;top:-18vmax}
.bg i:nth-child(2){background:var(--o);right:-24vmax;bottom:-26vmax;animation-delay:-6s;opacity:.26}
.bg i:nth-child(3){background:var(--d);right:-10vmax;top:-30vmax;animation-delay:-12s;opacity:.18}
@keyframes float{50%{transform:translate(6vmax,5vmax) scale(1.12)}}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px}
#mini{width:34px;height:34px;flex:none;cursor:pointer}
#prog{flex:1;height:10px;border-radius:99px;background:rgba(7,111,113,.14);overflow:hidden;opacity:0;transition:opacity .4s}
#prog.on{opacity:1}
#fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--o),var(--t),var(--d));background-size:200% 100%;animation:flow 4s linear infinite;transition:width .6s cubic-bezier(.3,.8,.3,1);position:relative}
@keyframes flow{to{background-position:200% 0}}
#cnt{font-size:13px;font-weight:800;color:var(--d);min-width:44px;text-align:right;opacity:0;transition:opacity .4s}
#cnt.on{opacity:1}
main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:26px 22px;box-shadow:0 18px 50px rgba(7,111,113,.14);backdrop-filter:blur(8px)}
.in-r{animation:inr .5s cubic-bezier(.2,.8,.2,1) both}
.in-l{animation:inl .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes inr{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--d);background:var(--m);border-radius:99px;padding:5px 12px;margin-bottom:14px}
.chip b{color:var(--o)}
h1,h2{font-family:Unbounded,Manrope,sans-serif;font-weight:700;line-height:1.22;text-wrap:balance}
h1{font-size:clamp(23px,6.4vw,32px)}
h2{font-size:clamp(19px,5vw,24px)}
.hint{color:var(--mut);font-size:14px;margin-top:6px}
.lead{color:var(--mut);margin-top:12px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{position:relative;display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:var(--n);cursor:pointer;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(#d3e2e1,#d3e2e1) border-box;transition:transform .18s,box-shadow .25s}
.opt:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(7,111,113,.12)}
.opt:active{transform:scale(.985)}
.opt:focus-visible,.btn:focus-visible,.dot:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--t);outline-offset:2px}
.opt.sel{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(110deg,var(--o),var(--t),var(--d),var(--t),var(--o)) border-box;background-size:100% 100%,200% 100%;animation:flow2 3.5s linear infinite;box-shadow:0 8px 24px rgba(11,181,175,.22)}
@keyframes flow2{to{background-position:0 0,200% 0}}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #b9cfcd;display:grid;place-items:center;transition:all .2s;background:#fff}
.box.r{border-radius:50%}
.sel .box{background:linear-gradient(135deg,var(--o),var(--t));border-color:transparent;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
.sel .box svg{stroke-dashoffset:0}
@keyframes pop{50%{transform:scale(1.3)}}
.other{margin-top:-2px;display:none}
.other.on{display:block;animation:inr .3s both}
input[type=text],textarea{width:100%;font:inherit;color:var(--n);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;resize:vertical}
textarea{min-height:132px;margin-top:18px}
input[type=text]:focus,textarea:focus{border-color:var(--t);outline:none;box-shadow:0 0 0 4px rgba(11,181,175,.18)}
.count{font-size:12px;color:var(--mut);text-align:right;margin-top:4px}
.scale{display:flex;justify-content:space-between;gap:8px;margin-top:26px}
.dot{flex:1;aspect-ratio:1;max-width:84px;border-radius:50%;border:2px solid #b9cfcd;background:#fff;font:800 20px Unbounded,sans-serif;color:var(--d);cursor:pointer;transition:transform .2s,background .3s,color .3s,border-color .3s}
.dot:hover{transform:translateY(-3px)}
.dot.on{background:linear-gradient(135deg,var(--o),var(--t));border-color:transparent;color:#fff;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--mut);margin-top:12px}
.nav{display:flex;gap:12px;margin-top:22px;align-items:center}
.btn{font:800 16px Manrope,sans-serif;border:0;border-radius:16px;padding:14px 24px;cursor:pointer;transition:transform .15s,box-shadow .25s,opacity .2s}
.btn.p{background:var(--d);color:#fff;flex:1;position:relative;overflow:hidden}
.btn.p::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.btn.p:hover{box-shadow:0 10px 24px rgba(7,111,113,.35);transform:translateY(-1px)}
.btn.p[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
.btn.p[disabled]::after{display:none}
.btn.g{background:transparent;color:var(--d);border:2px solid var(--line);padding:12px 18px}
.btn.g:hover{border-color:var(--t)}
.logo{width:min(300px,78%);height:auto;display:block;margin:0 auto 6px}
.c{text-align:center}
.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.meta span{background:var(--m);color:var(--d);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}
.info{background:var(--m);border-radius:18px;padding:16px 18px;margin-top:16px;font-size:15.5px}
.info li{margin:6px 0 6px 18px}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.tiny{font-size:12px;color:var(--mut);text-align:center}
/* результаты */
.res h3{font-family:Unbounded,sans-serif;font-size:15px;margin:22px 0 8px}
.rb{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;font-size:14px;margin:6px 0}
.rb .tr{grid-column:1/-1;height:10px;border-radius:99px;background:var(--m);overflow:hidden}
.rb .fl{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--o),var(--t));transition:width .9s cubic-bezier(.3,.8,.3,1)}
.rb b{text-align:right}
.ans{background:var(--m);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.short{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid #CFE3E1;border-radius:14px;background:#fff;color:#14202B;outline:none}.short:focus{border-color:#0BB5AF;box-shadow:0 0 0 4px rgba(11,181,175,.18)}
.optbadge{display:inline-block;margin:10px 0 0;padding:4px 12px;border-radius:999px;background:#FFF1E6;color:#C4560F;font-weight:700;font-size:13px}
.opt-note{margin:0 0 12px;padding:10px 14px;border-left:4px solid #F17425;background:#FFF8F2;border-radius:8px;font-size:15px;color:#4a3a2e}
</style>
</head>

 const say=m=>$('#msg').textContent=m,out=$('#out');
 const copy=(t)=>{out.style.display='block';out.value=t;out.select();try{navigator.clipboard.writeText(t).then(()=>say('Скопировано'),()=>say('Текст выделен: нажмите Ctrl+C'))}catch(e){say('Текст выделен: нажмите Ctrl+C')}};
 $('#csv').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';copy([['время','секунд'].concat(Q.map(x=>x.id)).join(',')].concat(all.map(r=>[r.ts,r.sec].concat(Q.map(x=>[].concat(r.a[x.id]).join(' | '))).map(q).join(','))).join('\n'))};
 $('#json').onclick=()=>copy(JSON.stringify(all));
 $('#imb').onclick=()=>{try{const d=JSON.parse($('#imp').value),ids=new Set(all.map(r=>r.id));let n=0;d.forEach(r=>{if(r&&r.id&&r.a&&!ids.has(r.id)){all.push(r);ids.add(r.id);n++}});save(all);results();$('#msg').textContent='Добавлено ответов: '+n}catch(e){say('Не удалось прочитать данные')}};
 let sure=0;$('#clr').onclick=()=>{if(!sure){sure=1;$('#clr').textContent='Точно очистить? Нажмите ещё раз';return}save([]);results()};
 $('#bk2').onclick=()=>{location.hash='';reset()}}
function bar(l,v,n){const p=Math.round(v/n*100);return `<div class="rb"><span>${esc(l)}</span><b>${p}%</b><div class="tr"><div class="fl" data-w="${p}%"></div></div></div>`}
/* старт */
$('#mini').onclick=()=>{if(++logoTaps>=5){logoTaps=0;location.hash='results'}setTimeout(()=>logoTaps=0,2500)};
addEventListener('hashchange',()=>{if(location.hash==='#results')results();else if(cur===-2){reset()}});
t0=Date.now();if(location.hash==='#results')results();else welcome();
